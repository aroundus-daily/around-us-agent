name: Gold and silver rates

on:
  schedule:
    - cron: "47 4 * * *"   # 10:17 AM IST every day
    - cron: "47 7 * * *"   # 1:17 PM IST, 2nd try if today's rate was not out yet
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      # repo Settings → Secrets and variables → Actions → Variables: AUTO_PUBLISH = 0 to go back to manual taps
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '1' }}
      # the 1:17 PM run (or a manual run) reports even when today's rate is missing
      GOLD_FINAL_RUN: ${{ github.event.schedule != '47 4 * * *' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 1. Make the gold rate post
        run: python agent/gold.py
      - name: 1b. Make the silver rate post
        run: python agent/silver.py
      - name: 2. Upload image to GitHub
        run: |
          git config user.name "around-us-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts/ data/
          git diff --cached --quiet || git commit -m "gold+silver: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
      - name: 3. Publish to Instagram (AUTO_PUBLISH=1) or send ✅ Post buttons to Telegram
        run: |
          python agent/send.py --gold
          python agent/send.py --silver
      - name: 4. Save post status (Instagram links) to GitHub
        if: always()
        run: |
          git add -A posts/ data/
          git diff --cached --quiet || git commit -m "status: $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
