name: Publish approved posts

on:
  schedule:
    - cron: "23 */2 * * *"   # checks your Telegram taps every 2 hours (retries after a failed auto-post)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approve
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish tapped posts to Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python agent/approve.py
      - name: Save status
        if: always()
        run: |
          git config user.name "around-us-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ posts/ || true
          git diff --cached --quiet && exit 0
          git commit -m "approve: $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
