name: Daily stories

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Make today's posts and send them to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python agent/daily.py
      - name: Upload images (Instagram fetches them from here)
        if: always()
        run: |
          git config user.name "around-us-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ posts/ || true
          git diff --cached --quiet && exit 0
          git commit -m "posts: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
